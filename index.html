<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AITI · AI人格测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;color:#fff;overflow-x:hidden}
.page{display:none;min-height:100vh;padding:20px;flex-direction:column;align-items:center;justify-content:center}
.page.active{display:flex}
h1{font-size:28px;text-align:center;margin-bottom:8px;background:linear-gradient(90deg,#e94560,#f5c542,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#8899aa;text-align:center;margin-bottom:30px;font-size:14px}
.card{background:rgba(255,255,255,0.08);border-radius:20px;padding:30px 24px;max-width:400px;width:100%;backdrop-filter:blur(10px);margin-bottom:20px}
.q-num{color:#e94560;font-size:13px;margin-bottom:12px}
.q-text{font-size:18px;margin-bottom:24px;line-height:1.5}
.btn{display:block;width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;cursor:pointer;margin-bottom:10px;transition:all 0.3s;text-align:left;font-weight:500}
.btn-a{background:rgba(233,69,96,0.2);color:#e94560;border:1px solid rgba(233,69,96,0.3)}
.btn-a:hover{background:rgba(233,69,96,0.35)}
.btn-b{background:rgba(0,210,255,0.2);color:#00d2ff;border:1px solid rgba(0,210,255,0.3)}
.btn-b:hover{background:rgba(0,210,255,0.35)}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-bottom:20px}
.progress-fill{height:100%;background:linear-gradient(90deg,#e94560,#f5c542);border-radius:2px;transition:width 0.3s}
.icons{font-size:48px;text-align:center;margin:20px 0}
.result-title{font-size:24px;text-align:center;margin:10px 0;font-weight:700}
.result-desc{color:#aaa;text-align:center;line-height:1.7;margin:15px 0;font-size:15px}
.result-model{display:inline-block;background:rgba(233,69,96,0.2);color:#e94560;padding:6px 16px;border-radius:20px;font-size:14px;margin-top:10px}
.share-btn{background:linear-gradient(90deg,#e94560,#f5c542);color:#fff;font-weight:700;font-size:16px;padding:14px 40px;border:none;border-radius:30px;cursor:pointer;margin-top:20px}
.restart-btn{background:rgba(255,255,255,0.1);color:#aaa;border:1px solid rgba(255,255,255,0.2);padding:12px 30px;border-radius:20px;cursor:pointer;margin-top:10px;font-size:14px}
.disclaimer{color:#556;text-align:center;font-size:11px;margin-top:30px;padding:0 20px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.5s ease}
</style>
</head>
<body>

<!-- Page 0: Welcome -->
<div class="page active" id="page0">
  <div class="icons">🧠</div>
  <h1>AI Type Indicator</h1>
  <p class="subtitle">16型AI人格测试 · 找到你的AI灵魂搭档</p>
  <div class="card fade-in">
    <p style="text-align:center;color:#aaa;line-height:1.8;font-size:15px">
      20道题 · 约3分钟<br>
      4个维度 · 16种AI人格<br>
      了解你的思维、沟通、工作和价值观
    </p>
  </div>
  <button class="share-btn" onclick="startTest()" style="width:100%;max-width:400px">开始测试</button>
  <p class="disclaimer">本测试仅供娱乐，不作为任何心理评估依据</p>
</div>

<!-- Page 1-20: Questions -->
<div class="page" id="pageQ">
  <div class="card fade-in" style="max-width:400px;width:100%">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="q-num" id="qNum">第 1/20 题</div>
    <div class="q-text" id="qText"></div>
    <button class="btn btn-a" id="btnA" onclick="answer('a')"></button>
    <button class="btn btn-b" id="btnB" onclick="answer('b')"></button>
  </div>
  <p class="disclaimer">本测试仅供娱乐，不作为任何心理评估依据</p>
</div>

<!-- Page Result -->
<div class="page" id="pageR">
  <div class="card fade-in" style="max-width:400px;width:100%;text-align:center">
    <div class="icons" id="rIcon"></div>
    <div class="result-title" id="rType"></div>
    <div class="result-model" id="rModel"></div>
    <div class="result-desc" id="rDesc"></div>
    <div style="margin-top:20px;text-align:left;color:#aaa;line-height:1.8;font-size:14px" id="rDetail"></div>
    <button class="share-btn" onclick="restartTest()">再测一次</button>
  </div>
  <p class="disclaimer">本测试仅供娱乐参考，不作为任何心理评估或专业诊断依据<br>AI人格类型名称及描述为原创设计，不构成对任何商标的使用</p>
</div>

<script>
// Dimensions: R/I, C/E, D/T, B/P
const questions = [
  {d:0, q:'遇到复杂问题时，你通常？', a:'一步步拆解，逐个击破', b:'先凭直觉找到大致方向'},
  {d:0, q:'学习新东西时，你更偏向？', a:'看教程，理清逻辑再动手', b:'直接上手试，边做边学'},
  {d:0, q:'做决定时，你依赖？', a:'数据和事实分析', b:'经验和直觉判断'},
  {d:0, q:'看一本难懂的书，你会？', a:'做笔记，画思维导图', b:'跳着看，先抓核心思想'},
  {d:0, q:'别人对你的评价更接近？', a:'逻辑清晰，有理有据', b:'创意十足，想法跳跃'},
  {d:1, q:'别人问你一个问题，你通常？', a:'一两句话直击要点', b:'从头到尾展开讲明白'},
  {d:1, q:'微信聊天你更像？', a:'言简意赅，能省则省', b:'喜欢发长语音或大段文字'},
  {d:1, q:'写报告/文案时？', a:'精准简洁，结论先行', b:'文采斐然，娓娓道来'},
  {d:1, q:'会议上发言？', a:'直奔主题，说完就停', b:'铺垫背景，层层递进'},
  {d:1, q:'发朋友圈的风格？', a:'图+短句，干净利落', b:'图文并茂，长文走心'},
  {d:2, q:'团队项目你更喜欢？', a:'分好工，各自独立完成', b:'随时沟通，一起推进'},
  {d:2, q:'遇到难题时？', a:'自己先想，解决不了再问', b:'立刻找人讨论碰撞思路'},
  {d:2, q:'周末你更想？', a:'一个人充电，看书打游戏', b:'约朋友出去，热闘一下'},
  {d:2, q:'工作节奏你偏好？', a:'深度沉浸，长时间专注', b:'多线并行，享受切换'},
  {d:2, q:'对工具的态度？', a:'一个最强的用到极致', b:'组合多个工具各取所长'},
  {d:3, q:'买AI工具时你更看重？', a:'够用就行，性价比第一', b:'能力为王，贵点没关系'},
  {d:3, q:'对于免费和付费？', a:'能免费绝不付费', b:'好东西值得花钱'},
  {d:3, q:'预算有限，你优先？', a:'找便宜的替代方案', b:'想办法增加预算买好的'},
  {d:3, q:'选择困难时？', a:'选最实惠的那个', b:'选最满意的那个'},
  {d:3, q:'对"一分钱一分货"的态度？', a:'同意，但性价比可以优化', b:'完全同意，贵有贵的道理'},
];

const results = {
  'RCDB':{icon:'⚡',type:'效率极简者',model:'DeepSeek Flash',desc:'你追求极致性价比，能用一句话解决绝不用两句。像一道闪电，快、准、省。',detail:'优势：高效务实，绝不浪费资源\n适合：高频调用、批量处理场景\n搭档：找个全能旗舰型互补'},
  'RCDP':{icon:'🏔️',type:'深度独行者',model:'Claude Opus',desc:'能力天花板，不凑合。喜欢一个人闷头干到极致，安静但实力碾压。',detail:'优势：深度思考，独立解决问题\n适合：复杂推理、编程攻坚\n搭档：找个协作型帮你分担沟通'},
  'RCTB':{icon:'🔧',type:'务实协作者',model:'GLM-5.2',desc:'务实可靠，性价比高。既能自己干活也能配合团队，是项目里最稳的那个。',detail:'优势：均衡可靠，科学思维\n适合：科研、数学、团队协作\n搭档：找个创意型激发灵感'},
  'RCTP':{icon:'🎯',type:'全能指挥官',model:'GPT-5.6 Sol',desc:'全面、协调、追求卓越。团队里的定海神针，什么场景都能打。',detail:'优势：全面全能，领导力强\n适合：复杂项目、商业决策\n搭档：找个极致性价比型帮你省钱'},
  'REDB':{icon:'🌿',type:'温和守望者',model:'MiniMax M3',desc:'温柔可靠，默默守护。不抢风头但永远在，是团队里最让人安心的存在。',detail:'优势：稳定输出，低幻觉\n适合：日常办公、内容创作\n搭档：找个能力天花板型互补'},
  'REDP':{icon:'🎨',type:'优雅创造者',model:'Claude Fable',desc:'创意与优雅并存。能写出最美的文字，也能想出最妙的方案。',detail:'优势：创意写作，审美在线\n适合：文案、品牌、艺术创作\n搭档：找个效率型帮你落地执行'},
  'RETB':{icon:'🌸',type:'温暖赋能者',model:'豆包 Seed',desc:'温和而有力量，像春天的阳光。善于鼓励和支持身边的人。',detail:'优势：视觉感知，温暖表达\n适合：教育、陪伴型场景\n搭档：找个理性分析型平衡'},
  'RETP':{icon:'🌟',type:'全能连接者',model:'Gemini 3.1 Pro',desc:'大团队里的全能选手。长袖善舞，既能深度思考又能广泛连接。',detail:'优势：多模态、长上下文、协作\n适合：跨部门项目、多模态任务\n搭档：找个极致效率型互补'},
  'ICDB':{icon:'💨',type:'极速直觉者',model:'GPT-4o',desc:'快人快语，直觉敏锐。想到就做，不等不等。全榜最快的输出速度就是你的节奏。',detail:'优势：反应迅速，直觉准确\n适合：高并发、即时响应场景\n搭档：找个深度思考型平衡'},
  'ICDP':{icon:'🦄',type:'特立独行者',model:'Muse Spark',desc:'不走寻常路，代码里的艺术家。在别人看不到的地方找到解决方案。',detail:'优势：创新编程，独特视角\n适合：前端开发、创意编程\n搭档：找个温暖协作者帮你落地'},
  'ICTB':{icon:'📚',type:'务实故事家',model:'文心 ERNIE',desc:'接地气，有深度。能把复杂的东西讲得老百姓都听懂，中文世界里的定海神针。',detail:'优势：中文表达，公文写作\n适合：本土化内容、正式文稿\n搭档：找个创意型拓展边界'},
  'ICTP':{icon:'🔥',type:'叛逆洞察者',model:'Grok 4.5',desc:'200万上下文，天马行空。喜欢挑战常规，在别人放弃的地方找到答案。',detail:'优势：超长文本，实时资讯\n适合：深度研究、趋势洞察\n搭档：找个执行型帮你落地'},
  'IEDB':{icon:'🍃',type:'朴实耕耘者',model:'混元 HY3',desc:'踏实肯干，温和务实。不追求轰轰烈烈，但每一步都走得稳。',detail:'优势：稳定产出，持续成长\n适合：日常运营、批量生产\n搭档：找个旗舰型提升上限'},
  'IEDP':{icon:'🚀',type:'远见开拓者',model:'Kimi K3',desc:'前端之王，天马行空。既能写出最漂亮的代码，也能看到最远的未来。',detail:'优势：前端开发，长程规划\n适合：产品设计、技术架构\n搭档：找个执行型帮你落地细节'},
  'IETB':{icon:'🌊',type:'流动探索者',model:'MiMo-V2.5',desc:'全球调用量冠军，人见人爱。灵活多变，在流量里找到自己的方向。',detail:'优势：广泛适配，高性价比\n适合：多样化场景、探索需求\n搭档：找个深度型互补'},
  'IETP':{icon:'👑',type:'全能新王者',model:'Qwen3.8',desc:'刚登顶Agent全球第一，苹果生态加持。全能型选手，十五个维度没有短板。',detail:'优势：Agent执行、中文、均衡\n适合：全场景、企业级应用\n搭档：你已经很强了，带带别人'},
};

let scores = [0,0,0,0]; // R/I, C/E, D/T, B/P
let currentQ = 0;
let shuffled = [];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startTest(){
  scores=[0,0,0,0];currentQ=0;
  shuffled=shuffle([...Array(questions.length).keys()]);
  document.getElementById('page0').classList.remove('active');
  document.getElementById('pageR').classList.remove('active');
  document.getElementById('pageQ').classList.add('active');
  showQuestion();
}

function showQuestion(){
  if(currentQ >= 20){
    showResult();return;
  }
  const qi = questions[shuffled[currentQ]];
  document.getElementById('qNum').textContent = `第 ${currentQ+1}/20 题`;
  document.getElementById('qText').textContent = qi.q;
  document.getElementById('btnA').textContent = qi.a;
  document.getElementById('btnB').textContent = qi.b;
  document.getElementById('progress').style.width = ((currentQ/20)*100)+'%';
  document.getElementById('pageQ').querySelector('.card').classList.remove('fade-in');
  void document.getElementById('pageQ').querySelector('.card').offsetWidth;
  document.getElementById('pageQ').querySelector('.card').classList.add('fade-in');
}

function answer(choice){
  const qi = questions[shuffled[currentQ]];
  scores[qi.d] += (choice === 'a') ? 1 : 0;
  currentQ++;
  showQuestion();
}

function showResult(){
  const dims = ['R','C','D','B'];
  let code = '';
  for(let i=0;i<4;i++){
    code += (scores[i] >= 3) ? dims[i] : dims[i].toLowerCase(); // upper=left side, lower=right side
  }
  // Convert: R/I=0, C/E=1, D/T=2, B/P=3
  // score >=3 means left side (R,C,D,B)
  const keyMap = {
    'RCDB':'RCDB','rCDB':'ICDB','RcDB':'REDB','rcDB':'IEDB',
    'RCdB':'RCTB','rCdB':'ICTB','RcdB':'RETB','rcdB':'IETB',
    'RCDb':'RCDP','rCDb':'ICDP','RcDb':'REDP','rcDb':'IEDP',
    'RCdb':'RCTP','rCdb':'ICTP','Rcdb':'RETP','rcdb':'IETP'
  };
  let key = '';
  key += (scores[0]>=3)?'R':'r';
  key += (scores[1]>=3)?'C':'c';
  key += (scores[2]>=3)?'D':'d';
  key += (scores[3]>=3)?'B':'b';

  const r = results[keyMap[key]] || results['RCDB'];

  document.getElementById('pageQ').classList.remove('active');
  document.getElementById('pageR').classList.add('active');
  document.getElementById('rIcon').textContent = r.icon;
  document.getElementById('rType').textContent = r.type;
  document.getElementById('rModel').textContent = '灵感原型：' + r.model;
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rDetail').innerHTML = r.detail.replace(/\n/g,'<br>').replace(/：/g,'：<br>');
}

function restartTest(){
  document.getElementById('pageR').classList.remove('active');
  document.getElementById('page0').classList.add('active');
}
</script>
</body>
</html>
